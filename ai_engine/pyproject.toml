[project]
name = "ai-trading-engine"
version = "1.0.0"
description = "Production-grade autonomous AI trading intelligence engine"
requires-python = ">=3.13"
authors = [{ name = "Quantum Intelligence" }]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "catboost>=1.2.0",
    "torch>=2.1.0",
]
rl = [
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",
]
all = [
    "ai-engine[ml,rl]",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "prometheus-client>=0.19.0",
    "loguru>=0.7.2",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
